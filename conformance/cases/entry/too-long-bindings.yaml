apiVersion: conformance.pact-ref/v1
kind: EntryCase
name: entry/too-long-with-bindings-max-length
spec:
  type: design
  reference:
    state: value
    value: https://example.com/a-long-design-reference
  bindings:
    apiVersion: pact.ref/v1
    kind: RefBindings
    metadata:
      domain: demo
    spec:
      types:
        design:
          ref:
            maxLength: 16
expect:
  outcome: error
  error: InvalidThingRef
  reason: TooLong
