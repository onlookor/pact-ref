apiVersion: conformance.pact-ref/v1
kind: EntryCase
name: entry/unknown-scheme-allow
spec:
  type: design
  reference:
    state: value
    value: mcp://build.example.com/run
  bindings:
    apiVersion: pact.ref/v1
    kind: RefBindings
    metadata:
      domain: demo
    spec:
      types:
        design:
          ref:
            schemes:
              - https
            onUnknownScheme: allow
expect:
  outcome: ok
  reference: mcp://build.example.com/run
