apiVersion: conformance.pact-ref/v1
kind: EntryCase
name: entry/pinning-required
spec:
  type: design
  reference:
    state: value
    value: https://example.com/design
  bindings:
    apiVersion: pact.ref/v1
    kind: RefBindings
    metadata:
      domain: demo
    spec:
      types:
        design:
          ref:
            pinning: required
expect:
  outcome: error
  error: ThingRefUnpinned
  reason: PinningRequired
