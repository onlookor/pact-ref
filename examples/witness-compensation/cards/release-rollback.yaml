apiVersion: pact.ref/v1
kind: ContractCard
metadata:
  id: release/rollback
  version: "1"
  owner: release-platform
  status: active
spec:
  capability:
    kind: mcp-tool
    server:
      id: mcp://ops.example.com/release-server
      trustAnchor: https://ops.example.com/.well-known/mcp
      protocol: "2025-06-18"
    tool:
      name: release.rollback
      version: "1"
      inputSchemaDigest: sha256:3333333333333333333333333333333333333333333333333333333333333333
      outputSchemaDigest: sha256:3333333333333333333333333333333333333333333333333333333333333333
    sideEffect: mutating
    idempotency:
      key: "release_id + idempotency_key"
      semantics: at-most-once
    result:
      materialization: required
      returns: urn:pact:artifact:rollback-receipt
      recordDigest: true
    auth:
      audience: pact-ref
      scopes: [release:rollback]
      credentialSource: broker
    timeoutMs: 600000
    failure:
      timeout: retryable-with-idempotency-key
      rollbackFailed: permanent
      unauthorized: permanent
  lifecycle:
    retention: P365D
    deletionPolicy: retain
  reference:
    schemes: [mcp, file]
    uriPattern: "mcp://ops.example.com/release-server/release.rollback@1#schema=sha256:3333333333333333333333333333333333333333333333333333333333333333"
